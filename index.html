<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flynn's Games</title>
  <meta name="description" content="Games Flynn builds live on stream. Play them free in your browser.">
  <meta name="theme-color" content="#04050c">
  <meta property="og:title" content="Flynn's Games">
  <meta property="og:description" content="Games I build live on stream. Play them free in your browser.">
  <meta property="og:image" content="https://financeflynn5-wq.github.io/img/steelbind.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g' cx='.35' cy='.35'><stop offset='0' stop-color='%23fff3c4'/><stop offset='.4' stop-color='%23ffb03a'/><stop offset='1' stop-color='%23ff3d2e'/></radialGradient></defs><circle cx='16' cy='16' r='12' fill='url(%23g)'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-page="home">
  <header class="topbar" id="topbar"></header>

  <section class="hero">
    <div class="wrap">
      <div class="reveal">
        <span class="eyebrow"><span class="dot"></span> Built live on stream</span>
        <h1><span class="glow">Flynn's</span><br>Games</h1>
        <p class="lead" id="site-tagline"></p>
        <div class="btn-row" id="hero-links">
          <a class="btn fire" href="#games">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            Play now
          </a>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="reveal" id="featured"></div>
    </div>
  </section>

  <main class="wrap" id="games">
    <div class="toolbar" role="search">
      <div class="chips" id="chips"></div>
      <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
    </div>

    <section class="section" id="play">
      <div class="section-head"><h2>Play now</h2><span class="count" id="play-count"></span></div>
      <div class="grid" id="play-grid"></div>
    </section>

    <section class="section" id="dev">
      <div class="section-head"><h2>In development</h2><span class="count" id="dev-count"></span></div>
      <div class="grid small" id="dev-grid"></div>
    </section>

    <p class="empty" id="no-results" hidden>No games match that search.</p>

    <div id="live-band"></div>
  </main>

  <footer id="footer"></footer>

  <script src="js/space.js?v=6"></script>
  <script src="js/fire.js?v=6"></script>
  <script src="js/games.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
